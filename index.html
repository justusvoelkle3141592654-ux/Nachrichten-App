<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #c00000;
    --accent-text: #ffffff;
    --border: #e0e0e5;
    --focus: #0a6cff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113;
      --surface: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa3;
      --accent: #e03b3b;
      --accent-text: #ffffff;
      --border: #2c2c31;
      --focus: #5aa9ff;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }
  .notice {
    flex: 0 0 auto;
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
  }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .view { flex: 0 0 auto; }

  /* Videosuche */
  .pane {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
  }
  .searchbar {
    display: flex;
    gap: 8px;
  }
  input, button { font: inherit; }
  input[type="search"], input[type="text"], input[type="url"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  button.primary {
    padding: 12px 18px;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.6; cursor: wait; }
  button.plain {
    padding: 12px 14px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
  }
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 16px 0 8px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    color: #9a9aa3;
  }
  .watch {
    color: var(--muted);
    font-size: 0.9rem;
    text-align: center;
  }
  .watch a, .status a { color: var(--focus); }
  .status {
    min-height: 1.4em;
    margin: 8px 0 12px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    color: inherit;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
  }
  .card.active { border-color: var(--accent); }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: var(--border);
  }
  .card .info { padding: 10px 12px 12px; }
  .card .title {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .channel { margin-top: 4px; color: var(--muted); font-size: 0.85rem; }

  /* Shorts-Feed: jeder Short füllt die Höhe und rastet beim Scrollen ein */
  .shorts {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .shorts .searchbar { padding: 12px 12px 0; }
  .shorts .status { margin: 8px 12px; min-height: 1.4em; }
  .shortbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0 12px 8px;
  }
  .shortbar .watch { margin: 0; text-align: left; }
  .tool {
    padding: 6px 10px;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  .tool.exit {
    display: none;
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    opacity: 0.85;
  }
  .feed-wrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  .feed {
    height: 100%;
    overflow-y: auto;
    scroll-snap-type: y mandatory;
    overscroll-behavior: contain;
    container-type: size;
  }
  .feed-wrap.empty .feed { scroll-snap-type: none; }
  .feed-hint {
    padding: 32px 16px;
    text-align: center;
    color: var(--muted);
  }
  .short {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: start;
    scroll-snap-stop: always;
  }
  .short-frame {
    position: relative;
    width: min(100cqw, calc((100cqh - 16px) * 9 / 16));
    aspect-ratio: 9 / 16;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  .short-frame iframe, .short-thumb {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .short-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .short-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 24px 12px 12px;
    color: #fff;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
  }
  .short-caption .title { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
  .short-caption .channel { margin-top: 2px; font-size: 0.85rem; opacity: 0.85; }
  .step {
    position: absolute;
    right: 12px;
    width: 44px;
    height: 44px;
    padding: 0;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    opacity: 0.9;
  }
  .step.up { top: calc(50% - 52px); }
  .step.down { top: calc(50% + 8px); }
  .feed-wrap.empty .step { display: none; }

  /* Short im Vollbild: nur der Short und der Feed, alles andere ist ausgeblendet */
  .app.immersive { background: #000; }
  .app.immersive .notice,
  .app.immersive .nav,
  .app.immersive .shorts .searchbar,
  .app.immersive .shorts .status,
  .app.immersive .shortbar { display: none; }
  .app.immersive .tool.exit { display: block; }
  .app.immersive .feed-wrap { background: #000; }
  .app.immersive .short-frame {
    width: min(100cqw, calc(100cqh * 9 / 16));
    border-radius: 0;
  }
  .app.immersive .step { opacity: 0.6; }

  /* Eingebettete Webseiten */
  .site {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .bar {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .bar a.open {
    flex: 0 0 auto;
    color: var(--focus);
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .bar button { flex: 0 0 auto; padding: 8px 12px; }
  .bar input { padding: 8px 12px; }
  .frame { position: relative; flex: 1; min-height: 0; }
  .frame iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
  .frame .placeholder { color: var(--muted); }

  /* Untere Leiste */
  .nav {
    flex: 0 0 auto;
    display: flex;
    overflow-x: auto;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab {
    flex: 1 0 auto;
    min-width: 84px;
    padding: 12px 14px;
    font-size: 0.85rem;
    white-space: nowrap;
    color: var(--muted);
    background: none;
    border: 0;
    border-top: 3px solid transparent;
    cursor: pointer;
  }
  .tab[aria-current="true"] {
    color: var(--text);
    font-weight: 600;
    border-top-color: var(--accent);
  }

  dialog {
    width: min(92vw, 420px);
    padding: 20px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  dialog h2 { margin: 0 0 12px; font-size: 1.1rem; }
  dialog label { display: block; margin: 10px 0 4px; font-size: 0.9rem; color: var(--muted); }
  dialog input { width: 100%; }
  dialog .error { min-height: 1.3em; margin: 8px 0 0; color: var(--accent); font-size: 0.9rem; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  @media (max-width: 600px) {
    .searchbar { flex-direction: column; }
    .searchbar button { width: 100%; }
    .bar { flex-wrap: wrap; }
    .bar input { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="notice" id="file-notice" hidden>
    Die Datei ist lokal geöffnet. YouTube zeigt dann in den Playern „Fehler 153“, weil
    die Herkunft der Seite fehlt. Öffne die Seite über eine https-Adresse (z. B. GitHub
    Pages) oder nutze „Auf YouTube öffnen“.
  </div>
  <main id="main"></main>
  <nav class="nav" id="nav" aria-label="Bereiche"></nav>
</div>

<dialog id="add-dialog">
  <form id="add-form">
    <h2>Webseite hinzufügen</h2>
    <label for="add-name">Name</label>
    <input type="text" id="add-name" maxlength="30" autocomplete="off" required>
    <label for="add-url">Adresse</label>
    <input type="url" id="add-url" placeholder="https://…" autocomplete="off" required>
    <p class="error" id="add-error" role="alert"></p>
    <div class="actions">
      <button type="button" class="plain" id="add-cancel">Abbrechen</button>
      <button type="submit" class="primary">Hinzufügen</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  // Öffentliche Piped- und Invidious-Server. Sie werden der Reihe nach probiert.
  const PIPED_SERVERS = [
    "api.piped.private.coffee",
    "pipedapi.kavin.rocks",
    "pipedapi.adminforge.de",
  ];
  const INVIDIOUS_SERVERS = [
    "inv.nadeko.net",
    "yewtu.be",
    "invidious.nerdvpn.de",
  ];
  const SERVERS = [
    ...PIPED_SERVERS.map((host) => ({ type: "piped", host })),
    ...INVIDIOUS_SERVERS.map((host) => ({ type: "invidious", host })),
  ];
  const TIMEOUT_MS = 6000;
  // YouTube-Video-IDs sind immer 11 Zeichen lang. Alles andere wird verworfen.
  const VIDEO_ID = /^[\w-]{11}$/;
  // Der Shorts-Feed liest die Shorts-Reiter der besten Kanäle zur Suche.
  const SHORTS_CHANNELS = 3;
  const SHORTS_PER_CHANNEL = 30;
  const CHANNEL_ID = /^UC[\w-]{22}$/;

  // Vorinstallierte Webseiten. Eine feste Adresse kann hier bei "url" eingetragen
  // werden. Ist sie leer, trägt man sie im Reiter einmal ein und sie bleibt gespeichert.
  const BUILTIN_SITES = [
    { id: "eaglercraft-web", name: "Eaglercraft Web", url: "" },
    { id: "eaglercraft-mobile", name: "Eaglercraft Mobile", url: "" },
  ];

  const KEY_CUSTOM = "dashboard.sites";
  const KEY_URLS = "dashboard.urls";
  const KEY_ACTIVE = "dashboard.active";

  // ---------- Hilfsfunktionen ----------

  // Texte aus Serverantworten und Eingaben werden nur per textContent gesetzt
  // und nie als HTML interpretiert.
  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  const memory = {};
  function load(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (raw !== null) return JSON.parse(raw);
    } catch (err) { /* Speicher gesperrt oder defekt */ }
    return key in memory ? memory[key] : fallback;
  }
  function save(key, value) {
    memory[key] = value;
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { /* ignorieren */ }
  }

  function normalizeUrl(raw) {
    let s = String(raw || "").trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
    try {
      const u = new URL(s);
      return u.protocol === "https:" || u.protocol === "http:" ? u.href : null;
    } catch (err) {
      return null;
    }
  }

  // Vollbild für die ganze Seite. Auf dem iPhone fehlt die Fullscreen-API für
  // normale Elemente, dort bleibt nur der Short-Vollbildmodus per CSS.
  function canFullscreen() {
    const app = document.querySelector(".app");
    return Boolean(app && (app.requestFullscreen || app.webkitRequestFullscreen));
  }
  function fullscreenElement() {
    return document.fullscreenElement || document.webkitFullscreenElement || null;
  }
  function enterFullscreen() {
    const app = document.querySelector(".app");
    const request = app.requestFullscreen || app.webkitRequestFullscreen;
    return request ? Promise.resolve(request.call(app)) : Promise.reject(new Error("unsupported"));
  }
  function exitFullscreen() {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit && fullscreenElement()) return Promise.resolve(exit.call(document)).catch(() => {});
    return Promise.resolve();
  }

  // ---------- Videosuche über Piped/Invidious ----------

  function buildUrl(server, query) {
    const q = encodeURIComponent(query);
    if (server.type === "piped") {
      return `https://${server.host}/search?filter=videos&q=${q}`;
    }
    return `https://${server.host}/api/v1/search?type=video&q=${q}`;
  }

  async function fetchJson(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  function parseResults(server, data) {
    const list = server.type === "piped" ? data && data.items : data;
    if (!Array.isArray(list)) return [];

    const results = [];
    for (const item of list) {
      if (!item || typeof item !== "object") continue;
      let id;
      let title;
      let channel;
      if (server.type === "piped") {
        const match = typeof item.url === "string" ? item.url.match(/[?&]v=([\w-]{11})/) : null;
        id = match ? match[1] : "";
        title = item.title;
        channel = item.uploaderName;
      } else {
        id = item.videoId;
        title = item.title;
        channel = item.author;
      }
      if (typeof id !== "string" || !VIDEO_ID.test(id)) continue;
      results.push({
        id,
        title: String(title ?? ""),
        channel: String(channel ?? ""),
      });
    }
    return results;
  }

  // Probiert die Server der Reihe nach und nimmt den ersten mit Ergebnissen.
  // Liefert null, wenn die Suche inzwischen überholt ist.
  async function findVideos(query, isCurrent) {
    let reachedAny = false;
    for (let round = 0; round < 2 && !reachedAny; round++) {
      for (const server of SERVERS) {
        try {
          const data = await fetchJson(buildUrl(server, query));
          if (!isCurrent()) return null;
          reachedAny = true;
          const results = parseResults(server, data);
          if (results.length > 0) return { results, server, reachedAny };
        } catch (err) {
          if (!isCurrent()) return null;
        }
      }
    }
    return { results: [], server: null, reachedAny };
  }

  function createSearchPane() {
    const pane = el("section", "view pane");

    const form = el("form", "searchbar");
    form.setAttribute("role", "search");
    const input = el("input");
    input.type = "search";
    input.placeholder = "Videos suchen, z. B. MrBeast";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "Suchbegriff");
    const button = el("button", "primary", "Suchen");
    button.type = "submit";
    form.append(input, button);

    const player = el("div", "player");
    player.append(el("div", "placeholder", "Wähle ein Video aus den Ergebnissen."));

    const watch = el("div", "watch");
    watch.hidden = true;
    const watchLink = el("a", "", "Auf YouTube öffnen");
    watchLink.target = "_blank";
    watchLink.rel = "noopener noreferrer";
    watch.append("Startet es nicht? ", watchLink);

    const status = el("div", "status");
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");

    const grid = el("div", "grid");

    pane.append(form, player, watch, status, grid);

    let searchId = 0;

    function playVideo(id) {
      const iframe = el("iframe");
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.allowFullscreen = true;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.title = "YouTube-Player";
      player.replaceChildren(iframe);

      // Lokal per file:// geöffnet, sendet der Browser keinen Referer, und
      // YouTube verweigert dann oft die Einbettung. Der Link ist der Ausweg.
      watchLink.href = `https://www.youtube.com/watch?v=${id}`;
      watch.hidden = false;
    }

    function selectCard(card) {
      for (const active of grid.querySelectorAll(".card.active")) {
        active.classList.remove("active");
      }
      card.classList.add("active");
    }

    function renderResults(results, server) {
      grid.replaceChildren();
      results.forEach((r, index) => {
        const card = el("button", "card");
        card.type = "button";

        const img = el("img");
        img.src = `https://i.ytimg.com/vi/${r.id}/mqdefault.jpg`;
        img.alt = "";
        img.loading = "lazy";

        const info = el("div", "info");
        info.append(el("div", "title", r.title), el("div", "channel", r.channel));
        card.append(img, info);
        card.addEventListener("click", () => {
          selectCard(card);
          playVideo(r.id);
        });
        grid.append(card);

        if (index === 0) {
          selectCard(card);
          playVideo(r.id);
        }
      });
      status.textContent = `${results.length} Ergebnisse (${server.host})`;
    }

    function showUnreachable(query) {
      const link = el("a", "", "Auf youtube.com suchen");
      link.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      status.replaceChildren("Alle Suchserver sind gerade nicht erreichbar. ", link);
    }

    async function search(query) {
      const id = ++searchId;
      const isCurrent = () => id === searchId;

      button.disabled = true;
      grid.replaceChildren();
      status.textContent = "Suche läuft …";

      const found = await findVideos(query, isCurrent);
      if (!found) return;

      if (found.results.length > 0) {
        renderResults(found.results, found.server);
      } else if (found.reachedAny) {
        status.textContent = "Keine Videos gefunden.";
      } else {
        showUnreachable(query);
      }
      button.disabled = false;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query) {
        status.textContent = "Bitte einen Suchbegriff eingeben.";
        return;
      }
      search(query);
    });

    return pane;
  }

  // ---------- Shorts-Feed ----------

  // Fragt die Piped-Server der Reihe nach. Wirft einen Fehler, wenn keiner
  // antwortet, und liefert null, wenn die Suche inzwischen überholt ist.
  async function pipedGet(path, isCurrent) {
    for (let round = 0; round < 2; round++) {
      for (const host of PIPED_SERVERS) {
        try {
          const data = await fetchJson(`https://${host}${path}`);
          return isCurrent() ? { host, data } : null;
        } catch (err) {
          if (!isCurrent()) return null;
        }
      }
    }
    throw new Error("unreachable");
  }

  // Liest den Shorts-Reiter eines Kanals. Fehler einzelner Kanäle sind egal.
  async function loadChannelShorts(channel, isCurrent) {
    try {
      const info = await pipedGet(`/channel/${channel.id}`, isCurrent);
      if (!info) return [];
      const tabs = Array.isArray(info.data && info.data.tabs) ? info.data.tabs : [];
      const tab = tabs.find((t) => t && String(t.name).toLowerCase() === "shorts" && typeof t.data === "string");
      if (!tab) return [];
      const res = await pipedGet(`/channels/tabs?data=${encodeURIComponent(tab.data)}`, isCurrent);
      if (!res) return [];
      const content = Array.isArray(res.data && res.data.content) ? res.data.content : [];
      const shorts = [];
      for (const item of content) {
        const match = item && typeof item.url === "string" ? item.url.match(/[?&]v=([\w-]{11})/) : null;
        if (!match) continue;
        shorts.push({
          id: match[1],
          title: String(item.title ?? ""),
          channel: channel.name,
        });
        if (shorts.length >= SHORTS_PER_CHANNEL) break;
      }
      return shorts;
    } catch (err) {
      return [];
    }
  }

  // Mischt die Shorts der Kanäle abwechselnd und entfernt doppelte.
  function interleave(lists) {
    const out = [];
    const seen = new Set();
    for (let i = 0; lists.some((l) => i < l.length); i++) {
      for (const list of lists) {
        const item = list[i];
        if (item && !seen.has(item.id)) {
          seen.add(item.id);
          out.push(item);
        }
      }
    }
    return out;
  }

  // Liefert { shorts, channels } oder null, wenn die Suche überholt ist.
  async function findShorts(query, isCurrent) {
    const found = await pipedGet(`/search?filter=channels&q=${encodeURIComponent(query)}`, isCurrent);
    if (!found) return null;
    const items = Array.isArray(found.data && found.data.items) ? found.data.items : [];
    const channels = [];
    for (const item of items) {
      const match = item && typeof item.url === "string" ? item.url.match(/\/channel\/([\w-]+)/) : null;
      if (match && CHANNEL_ID.test(match[1])) {
        channels.push({ id: match[1], name: String(item.name ?? "") });
      }
      if (channels.length >= SHORTS_CHANNELS) break;
    }
    const lists = await Promise.all(channels.map((c) => loadChannelShorts(c, isCurrent)));
    if (!isCurrent()) return null;
    return { shorts: interleave(lists), channels: channels.filter((c, i) => lists[i].length > 0) };
  }

  function createShortsPane() {
    const pane = el("section", "view shorts");

    const form = el("form", "searchbar");
    form.setAttribute("role", "search");
    const input = el("input");
    input.type = "search";
    input.placeholder = "Kanal oder Thema, z. B. MrBeast";
    input.autocomplete = "off";
    input.setAttribute("aria-label", "Kanal oder Thema");
    const button = el("button", "primary", "Suchen");
    button.type = "submit";
    form.append(input, button);

    const status = el("div", "status");
    status.setAttribute("role", "status");
    status.setAttribute("aria-live", "polite");

    const watch = el("div", "watch");
    watch.hidden = true;
    const watchLink = el("a", "", "Auf YouTube öffnen");
    watchLink.target = "_blank";
    watchLink.rel = "noopener noreferrer";
    watch.append("Startet es nicht? ", watchLink);

    const wrap = el("div", "feed-wrap");
    const feed = el("div", "feed");
    feed.tabIndex = 0;
    feed.setAttribute("aria-label", "Shorts, mit Pfeiltasten oder Wischen blättern");
    const upBtn = el("button", "step up", "▲");
    upBtn.type = "button";
    upBtn.setAttribute("aria-label", "Vorheriger Short");
    const downBtn = el("button", "step down", "▼");
    downBtn.type = "button";
    downBtn.setAttribute("aria-label", "Nächster Short");
    const exitBtn = el("button", "tool exit", "✕ Schließen");
    exitBtn.type = "button";
    exitBtn.setAttribute("aria-label", "Vollbild beenden");
    wrap.append(feed, upBtn, downBtn, exitBtn);

    const pageBtn = el("button", "tool", "Seite im Vollbild");
    pageBtn.type = "button";
    pageBtn.hidden = !canFullscreen();
    const shortBtn = el("button", "tool", "Short im Vollbild");
    shortBtn.type = "button";
    const bar = el("div", "shortbar");
    bar.append(pageBtn, shortBtn, watch);

    pane.append(form, status, bar, wrap);

    function showHint(text) {
      feed.replaceChildren(el("div", "feed-hint", text));
      wrap.classList.add("empty");
    }
    showHint("Gib einen Kanal oder ein Thema ein, z. B. MrBeast. Dann kannst du durch die Shorts scrollen.");

    let searchId = 0;
    let observer = null;
    let timer = 0;
    let entries = []; // Einträge des Feeds: { id, title, item, frame, thumb }
    let position = 0; // Index des Shorts, der zuletzt im Bild war
    let current = null; // Eintrag, dessen Player gerade geladen ist

    function stop() {
      clearTimeout(timer);
      if (current) {
        current.frame.replaceChildren(current.thumb);
        current = null;
      }
    }

    function activate(entry) {
      if (current === entry) return;
      stop();
      const iframe = el("iframe");
      const id = entry.id;
      iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&loop=1&playlist=${id}&playsinline=1&rel=0`;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      iframe.allowFullscreen = true;
      iframe.allow = "autoplay; encrypted-media; picture-in-picture";
      iframe.title = entry.title || "YouTube Short";
      entry.frame.replaceChildren(iframe);
      current = entry;
      position = entries.indexOf(entry);
      watchLink.href = `https://www.youtube.com/shorts/${id}`;
      watch.hidden = false;
    }

    function renderFeed(shorts) {
      if (observer) observer.disconnect();
      stop();
      wrap.classList.remove("empty");
      entries = shorts.map((s) => {
        const item = el("div", "short");
        const frame = el("div", "short-frame");
        const thumb = el("div", "short-thumb");
        const img = el("img");
        img.src = `https://i.ytimg.com/vi/${s.id}/hqdefault.jpg`;
        img.alt = "";
        img.loading = "lazy";
        const caption = el("div", "short-caption");
        caption.append(el("div", "title", s.title), el("div", "channel", s.channel));
        thumb.append(img, caption);
        frame.append(thumb);
        item.append(frame);
        return { id: s.id, title: s.title, item, frame, thumb };
      });
      feed.replaceChildren(...entries.map((e) => e.item));
      feed.scrollTop = 0;

      // Nur der Short im Bild lädt einen Player. Das spart Daten und verhindert,
      // dass mehrere Videos gleichzeitig laufen.
      observer = new IntersectionObserver((records) => {
        for (const record of records) {
          if (!record.isIntersecting) continue;
          const entry = entries.find((e) => e.item === record.target);
          clearTimeout(timer);
          timer = setTimeout(() => activate(entry), 250);
        }
      }, { root: feed, threshold: 0.6 });
      for (const e of entries) observer.observe(e.item);
      if (entries.length > 0) activate(entries[0]);
    }

    function step(direction) {
      feed.scrollBy({ top: direction * feed.clientHeight, behavior: "smooth" });
    }
    upBtn.addEventListener("click", () => step(-1));
    downBtn.addEventListener("click", () => step(1));

    // Nach einem Wechsel des Vollbildmodus ändert sich die Höhe des Feeds.
    // Dann wird wieder auf den aktuellen Short gesprungen.
    let realignTimer = 0;
    function realign() {
      clearTimeout(realignTimer);
      realignTimer = setTimeout(() => {
        feed.scrollTop = position * feed.clientHeight;
      }, 100);
    }
    window.addEventListener("resize", realign);

    const app = document.querySelector(".app");
    let immersive = false;
    let immersiveFullscreen = false; // Vollbild wurde vom Short-Modus gestartet

    function setImmersive(on) {
      immersive = on;
      app.classList.toggle("immersive", on);
      shortBtn.textContent = on ? "Short-Vollbild beenden" : "Short im Vollbild";
      realign();
    }

    function leaveImmersive() {
      setImmersive(false);
      if (immersiveFullscreen) {
        immersiveFullscreen = false;
        exitFullscreen();
      }
    }

    shortBtn.addEventListener("click", () => {
      if (immersive) {
        leaveImmersive();
        return;
      }
      const alreadyFullscreen = Boolean(fullscreenElement());
      setImmersive(true);
      if (!alreadyFullscreen) {
        enterFullscreen().then(() => { immersiveFullscreen = true; }).catch(() => {});
      }
    });
    exitBtn.addEventListener("click", leaveImmersive);

    pageBtn.addEventListener("click", () => {
      if (fullscreenElement()) {
        exitFullscreen();
      } else {
        enterFullscreen().catch(() => {
          status.textContent = "Dein Browser erlaubt hier kein Vollbild.";
        });
      }
    });

    function onFullscreenChange() {
      const on = Boolean(fullscreenElement());
      pageBtn.textContent = on ? "Vollbild beenden" : "Seite im Vollbild";
      // Esc im Vollbild beendet auch den Short-Vollbildmodus.
      if (!on && immersive && immersiveFullscreen) leaveImmersive();
      realign();
    }
    document.addEventListener("fullscreenchange", onFullscreenChange);
    document.addEventListener("webkitfullscreenchange", onFullscreenChange);
    // Ohne Fullscreen-API (z. B. iPhone) beendet Esc den Short-Modus per Tastatur.
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && immersive && !fullscreenElement()) leaveImmersive();
    });

    async function search(query) {
      const id = ++searchId;
      const isCurrent = () => id === searchId;

      button.disabled = true;
      watch.hidden = true;
      stop();
      status.textContent = "Suche läuft …";

      try {
        const found = await findShorts(query, isCurrent);
        if (!found) return;
        if (found.shorts.length > 0) {
          renderFeed(found.shorts);
          status.textContent = `${found.shorts.length} Shorts von: ${found.channels.map((c) => c.name).join(", ")}`;
        } else {
          showHint("Keine Shorts gefunden. Versuche einen Kanalnamen.");
          status.textContent = "";
        }
      } catch (err) {
        const link = el("a", "", "Auf youtube.com suchen");
        link.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query + " shorts")}`;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        status.replaceChildren("Alle Suchserver sind gerade nicht erreichbar. ", link);
      }
      if (isCurrent()) button.disabled = false;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = input.value.trim();
      if (!query) {
        status.textContent = "Bitte einen Kanal oder ein Thema eingeben.";
        return;
      }
      search(query);
    });

    // Beim Verlassen des Reiters wird der Player entfernt, damit nichts im
    // Hintergrund weiterläuft. Beim Zurückkehren startet der sichtbare Short neu.
    function onHide() {
      stop();
    }
    function onShow() {
      if (entries.length === 0) return;
      const index = Math.round(feed.scrollTop / Math.max(feed.clientHeight, 1));
      activate(entries[Math.min(index, entries.length - 1)]);
    }

    return { pane, onHide, onShow };
  }

  // ---------- Eingebettete Webseiten ----------

  // onChange meldet eine neue Adresse, onRemove ist nur bei eigenen Seiten gesetzt.
  function createSitePane(site, { onChange, onRemove }) {
    const pane = el("section", "view site");

    const bar = el("form", "bar");
    const input = el("input");
    input.type = "text";
    input.placeholder = `Adresse von ${site.name} einfügen`;
    input.autocomplete = "off";
    input.setAttribute("aria-label", `Adresse von ${site.name}`);
    const loadBtn = el("button", "plain", "Laden");
    loadBtn.type = "submit";
    const openLink = el("a", "open", "Neuer Tab");
    openLink.target = "_blank";
    openLink.rel = "noopener noreferrer";
    bar.append(input, loadBtn, openLink);

    if (onRemove) {
      const removeBtn = el("button", "plain", "Entfernen");
      removeBtn.type = "button";
      removeBtn.addEventListener("click", () => {
        if (confirm(`„${site.name}“ entfernen?`)) onRemove();
      });
      bar.append(removeBtn);
    }

    const frame = el("div", "frame");
    pane.append(bar, frame);

    function show(url) {
      if (!url) {
        openLink.hidden = true;
        openLink.removeAttribute("href");
        frame.replaceChildren(el("div", "placeholder", "Adresse oben einfügen und „Laden“ drücken. Sie bleibt gespeichert."));
        return;
      }
      input.value = url;
      openLink.href = url;
      openLink.hidden = false;

      const iframe = el("iframe");
      iframe.src = url;
      iframe.title = site.name;
      // Viele Seiten verbieten das Einbetten. Dann hilft der Link "Neuer Tab".
      iframe.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-modals allow-downloads");
      iframe.allow = "fullscreen; autoplay; gamepad; clipboard-write";
      iframe.allowFullscreen = true;
      iframe.referrerPolicy = "strict-origin-when-cross-origin";
      frame.replaceChildren(iframe);
    }

    bar.addEventListener("submit", (event) => {
      event.preventDefault();
      const url = normalizeUrl(input.value);
      if (!url) {
        input.setCustomValidity("Bitte eine gültige http(s)-Adresse eingeben.");
        input.reportValidity();
        input.setCustomValidity("");
        return;
      }
      show(url);
      onChange(url);
    });

    show(site.url);
    return pane;
  }

  // ---------- Dashboard ----------

  const main = document.getElementById("main");
  const nav = document.getElementById("nav");
  const dialog = document.getElementById("add-dialog");
  const addForm = document.getElementById("add-form");
  const addName = document.getElementById("add-name");
  const addUrl = document.getElementById("add-url");
  const addError = document.getElementById("add-error");

  // Reiter in Reihenfolge: { id, label, pane }
  const tabs = [];
  let customSites = [];
  let savedUrls = {};
  let activeId = "videos";

  function select(id) {
    if (!tabs.some((t) => t.id === id)) id = "videos";
    const previous = tabs.find((t) => t.id === activeId);
    if (previous && previous.id !== id && previous.onHide) previous.onHide();
    activeId = id;
    save(KEY_ACTIVE, id);
    for (const t of tabs) t.pane.hidden = t.id !== id;
    const next = tabs.find((t) => t.id === id);
    if (next && next.onShow) next.onShow();
    renderNav();
  }

  function renderNav() {
    const buttons = tabs.map((t) => {
      const b = el("button", "tab", t.label);
      b.type = "button";
      b.setAttribute("aria-current", String(t.id === activeId));
      b.addEventListener("click", () => select(t.id));
      return b;
    });
    const add = el("button", "tab", "+ Seite");
    add.type = "button";
    add.addEventListener("click", openDialog);
    nav.replaceChildren(...buttons, add);
  }

  // hooks.onHide/onShow werden beim Verlassen bzw. Öffnen des Reiters aufgerufen.
  function addTab(id, label, pane, hooks = {}) {
    pane.hidden = true;
    main.append(pane);
    tabs.push({ id, label, pane, ...hooks });
  }

  function addBuiltinSite(site) {
    const url = normalizeUrl(savedUrls[site.id]) || normalizeUrl(site.url) || "";
    const pane = createSitePane({ name: site.name, url }, {
      onChange: (newUrl) => {
        savedUrls[site.id] = newUrl;
        save(KEY_URLS, savedUrls);
      },
    });
    addTab(site.id, site.name, pane);
  }

  function addCustomSite(site) {
    const pane = createSitePane(site, {
      onChange: (newUrl) => {
        site.url = newUrl;
        save(KEY_CUSTOM, customSites);
      },
      onRemove: () => {
        const index = tabs.findIndex((t) => t.id === site.id);
        if (index >= 0) {
          tabs[index].pane.remove();
          tabs.splice(index, 1);
        }
        customSites = customSites.filter((s) => s.id !== site.id);
        save(KEY_CUSTOM, customSites);
        select("videos");
      },
    });
    addTab(site.id, site.name, pane);
  }

  function openDialog() {
    addForm.reset();
    addError.textContent = "";
    dialog.showModal();
    addName.focus();
  }

  document.getElementById("add-cancel").addEventListener("click", () => dialog.close());

  addForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = addName.value.trim();
    const url = normalizeUrl(addUrl.value);
    if (!name) {
      addError.textContent = "Bitte einen Namen eingeben.";
      return;
    }
    if (!url) {
      addError.textContent = "Bitte eine gültige http(s)-Adresse eingeben.";
      return;
    }
    const site = { id: `custom-${Date.now()}`, name, url };
    customSites.push(site);
    save(KEY_CUSTOM, customSites);
    addCustomSite(site);
    dialog.close();
    select(site.id);
  });

  function init() {
    // Von file:// aus sendet der Browser keine Herkunft, und YouTube lehnt die Player ab.
    document.getElementById("file-notice").hidden = location.protocol !== "file:";

    addTab("videos", "Videos", createSearchPane());
    const shorts = createShortsPane();
    addTab("shorts", "Shorts", shorts.pane, { onHide: shorts.onHide, onShow: shorts.onShow });

    const urls = load(KEY_URLS, {});
    savedUrls = urls && typeof urls === "object" && !Array.isArray(urls) ? urls : {};
    for (const site of BUILTIN_SITES) addBuiltinSite(site);

    const stored = load(KEY_CUSTOM, []);
    customSites = (Array.isArray(stored) ? stored : [])
      .filter((s) => s && typeof s.id === "string" && typeof s.name === "string" && normalizeUrl(s.url))
      .map((s) => ({ id: s.id, name: s.name.slice(0, 30), url: normalizeUrl(s.url) }));
    for (const site of customSites) addCustomSite(site);

    const active = load(KEY_ACTIVE, "videos");
    select(typeof active === "string" ? active : "videos");
  }

  init();
})();
</script>
</body>
</html>
