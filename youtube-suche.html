<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube-Suche</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #c00000;
    --accent-text: #ffffff;
    --border: #e0e0e5;
    --focus: #0a6cff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111113;
      --surface: #1c1c1f;
      --text: #f2f2f4;
      --muted: #9a9aa3;
      --accent: #e03b3b;
      --accent-text: #ffffff;
      --border: #2c2c31;
      --focus: #5aa9ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 8px 0 12px;
  }
  .search {
    display: flex;
    gap: 8px;
  }
  .search input {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .search input:focus-visible,
  button:focus-visible,
  a:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  .search button {
    padding: 12px 18px;
    font: inherit;
    font-weight: 600;
    color: var(--accent-text);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  .search button:disabled {
    opacity: 0.6;
    cursor: wait;
  }
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    margin: 16px 0 8px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
  }
  .player iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .player .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    text-align: center;
    color: #9a9aa3;
  }
  .status {
    min-height: 1.4em;
    margin: 8px 0 12px;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .status a {
    color: var(--focus);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    display: flex;
    flex-direction: column;
    padding: 0;
    overflow: hidden;
    font: inherit;
    color: inherit;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 12px;
    cursor: pointer;
  }
  .card.active {
    border-color: var(--accent);
  }
  .card img {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    background: var(--border);
  }
  .card .info {
    padding: 10px 12px 12px;
  }
  .card .title {
    font-weight: 600;
    font-size: 0.95rem;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card .channel {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  @media (max-width: 600px) {
    .search {
      flex-direction: column;
    }
    .search button {
      width: 100%;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>YouTube-Suche</h1>

  <form class="search" id="search-form" role="search">
    <input type="search" id="query" placeholder="Videos suchen, z. B. MrBeast" aria-label="Suchbegriff" autocomplete="off">
    <button type="submit" id="search-btn">Suchen</button>
  </form>

  <div class="player" id="player">
    <div class="placeholder">Wähle ein Video aus den Ergebnissen.</div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="grid" id="results"></div>
</div>

<script>
  // Öffentliche Piped- und Invidious-Server. Sie werden der Reihe nach probiert.
  const PIPED_SERVERS = [
    "pipedapi.kavin.rocks",
    "pipedapi.adminforge.de",
    "api.piped.private.coffee",
  ];
  const INVIDIOUS_SERVERS = [
    "inv.nadeko.net",
    "yewtu.be",
    "invidious.nerdvpn.de",
  ];
  const SERVERS = [
    ...PIPED_SERVERS.map((host) => ({ type: "piped", host })),
    ...INVIDIOUS_SERVERS.map((host) => ({ type: "invidious", host })),
  ];
  const TIMEOUT_MS = 6000;
  // YouTube-Video-IDs sind immer 11 Zeichen lang. Alles andere wird verworfen.
  const VIDEO_ID = /^[\w-]{11}$/;

  const form = document.getElementById("search-form");
  const input = document.getElementById("query");
  const button = document.getElementById("search-btn");
  const playerEl = document.getElementById("player");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  let searchId = 0;

  function buildUrl(server, query) {
    const q = encodeURIComponent(query);
    if (server.type === "piped") {
      return `https://${server.host}/search?filter=videos&q=${q}`;
    }
    return `https://${server.host}/api/v1/search?type=video&q=${q}`;
  }

  async function fetchJson(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
    try {
      const res = await fetch(url, { signal: controller.signal });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // Liefert nur Einträge mit gültiger Video-ID. Texte bleiben Rohwerte und
  // werden später per textContent angezeigt, nie als HTML interpretiert.
  function parseResults(server, data) {
    const list = server.type === "piped" ? data && data.items : data;
    if (!Array.isArray(list)) return [];

    const results = [];
    for (const item of list) {
      if (!item || typeof item !== "object") continue;
      let id;
      let title;
      let channel;
      if (server.type === "piped") {
        const match = typeof item.url === "string" ? item.url.match(/[?&]v=([\w-]{11})/) : null;
        id = match ? match[1] : "";
        title = item.title;
        channel = item.uploaderName;
      } else {
        id = item.videoId;
        title = item.title;
        channel = item.author;
      }
      if (typeof id !== "string" || !VIDEO_ID.test(id)) continue;
      results.push({
        id,
        title: String(title ?? ""),
        channel: String(channel ?? ""),
      });
    }
    return results;
  }

  function setBusy(busy) {
    button.disabled = busy;
  }

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function playVideo(id) {
    const iframe = document.createElement("iframe");
    iframe.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
    iframe.referrerPolicy = "strict-origin-when-cross-origin";
    iframe.allowFullscreen = true;
    iframe.allow = "autoplay; encrypted-media; picture-in-picture";
    iframe.title = "YouTube-Player";
    playerEl.replaceChildren(iframe);
  }

  function selectCard(card) {
    for (const active of resultsEl.querySelectorAll(".card.active")) {
      active.classList.remove("active");
    }
    card.classList.add("active");
  }

  function renderResults(results, server) {
    resultsEl.replaceChildren();
    results.forEach((r, index) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "card";

      const img = document.createElement("img");
      img.src = `https://i.ytimg.com/vi/${r.id}/mqdefault.jpg`;
      img.alt = "";
      img.loading = "lazy";

      const info = document.createElement("div");
      info.className = "info";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = r.title;

      const channel = document.createElement("div");
      channel.className = "channel";
      channel.textContent = r.channel;

      info.append(title, channel);
      card.append(img, info);
      card.addEventListener("click", () => {
        selectCard(card);
        playVideo(r.id);
      });
      resultsEl.append(card);

      if (index === 0) {
        selectCard(card);
        playVideo(r.id);
      }
    });
    setStatus(`${results.length} Ergebnisse (${server.host})`);
  }

  function showUnreachable(query) {
    const link = document.createElement("a");
    link.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = "Auf youtube.com suchen";

    statusEl.replaceChildren("Alle Suchserver sind gerade nicht erreichbar. ", link);
  }

  async function search(query) {
    const id = ++searchId;
    let reachedAny = false;

    setBusy(true);
    resultsEl.replaceChildren();
    setStatus("Suche läuft …");

    for (const server of SERVERS) {
      try {
        const data = await fetchJson(buildUrl(server, query));
        if (id !== searchId) return;
        reachedAny = true;
        const results = parseResults(server, data);
        if (results.length > 0) {
          renderResults(results, server);
          setBusy(false);
          return;
        }
      } catch (err) {
        if (id !== searchId) return;
      }
    }

    if (id !== searchId) return;
    if (reachedAny) {
      setStatus("Keine Videos gefunden.");
    } else {
      showUnreachable(query);
    }
    setBusy(false);
  }

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const query = input.value.trim();
    if (!query) {
      setStatus("Bitte einen Suchbegriff eingeben.");
      return;
    }
    search(query);
  });
</script>
</body>
</html>
